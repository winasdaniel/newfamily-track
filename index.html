<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>새가족 방문자 관리</title>
<!-- BUILD_MARKER: label-to-div-fix-v2 -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --navy:#1F3864; --gold:#F2B90C; --gold-soft:#FDF3D2;
    --bg:#F7F8FA; --card:#FFFFFF; --text:#1c2230; --muted:#6b7280; --border:#E5E7EB;
    --danger:#D9534F; --ok:#2E9E5B;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif;}
  .app{max-width:720px;margin:0 auto;padding:16px 16px 90px;}
  header.top{position:relative;display:flex;align-items:center;justify-content:center;padding:16px 4px 20px;text-align:center;}
  header.top .title{font-weight:800;font-size:22px;color:var(--navy);letter-spacing:-.3px;}
  header.top .gear{position:absolute;top:14px;right:4px;background:none;border:none;font-size:20px;cursor:pointer;}
  header.top .version-tag{position:absolute;top:16px;left:6px;font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.2px;}
  .app-footer{text-align:center;padding:28px 0 10px;}
  .app-footer .logo{height:56px;width:auto;opacity:.9;}
  .filter-row{display:flex;gap:8px;margin-bottom:12px;}
  .filter-btn{flex:1;padding:9px 4px;border-radius:10px;border:1.5px solid var(--border);background:var(--card);color:var(--muted);font-size:12.5px;font-weight:700;cursor:pointer;}
  .filter-btn.active{background:var(--navy);color:#fff;border-color:var(--navy);}
  .export-row{display:flex;gap:8px;margin-top:10px;}
  .export-row .btn-sm{flex:1;}
  .tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:4px;margin-bottom:16px;}
  .tab-btn{flex:1;text-align:center;padding:10px 4px;border:none;background:transparent;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;}
  .tab-btn.active{background:var(--navy);color:#fff;}
  .view{display:none;} .view.active{display:block;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:14px;overflow-x:hidden;}
  .card h2{margin:0 0 4px;font-size:16px;color:var(--navy);}
  .card p.hint{margin:0 0 14px;font-size:12.5px;color:var(--muted);line-height:1.5;}
  .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;}
  .stat{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 8px;text-align:center;}
  .stat .num{font-size:22px;font-weight:800;color:var(--navy);}
  .stat .label{font-size:11px;color:var(--muted);margin-top:4px;}
  .rate-bar-wrap{background:var(--gold-soft);border-radius:10px;height:10px;overflow:hidden;margin-top:6px;}
  .rate-bar{height:100%;background:var(--gold);border-radius:10px;transition:width .3s;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 16px;border-radius:12px;border:none;font-size:14px;font-weight:700;cursor:pointer;width:100%;}
  .btn-primary{background:var(--navy);color:#fff;} .btn-primary:disabled{opacity:.5;}
  .btn-gold{background:var(--gold);color:#3a2e00;}
  .btn-outline{background:transparent;border:1.5px solid var(--border);color:var(--text);}
  .btn-sm{width:auto;padding:8px 12px;font-size:12.5px;border-radius:10px;}
  .camera-box{border:2px dashed var(--border);border-radius:14px;padding:20px;text-align:center;margin-bottom:14px;cursor:pointer;}
  .camera-box img{max-width:100%;max-height:220px;border-radius:10px;margin-bottom:10px;display:block;margin:0 auto 10px;}
  .camera-box .icon{font-size:32px;margin-bottom:6px;}
  .camera-box .sub{font-size:12px;color:var(--muted);margin-top:4px;}
  input[type=file]{display:none;}
  .field{display:block;margin-bottom:12px;}
  .field span{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:5px;}
  input[type=text], input[type=date], textarea, select{width:100%;max-width:100%;box-sizing:border-box;padding:11px 12px;border:1.5px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);font-size:14.5px;font-family:inherit;-webkit-appearance:none;appearance:none;}
  textarea{resize:vertical;min-height:60px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .visitor-item{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:8px;}
  .row-summary{display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer;}
  .row-main{display:flex;align-items:center;gap:6px;min-width:0;flex:1;}
  .row-main .chevron{font-size:11px;color:var(--muted);flex-shrink:0;transition:transform .15s;display:inline-block;}
  .visitor-item.expanded .chevron{transform:rotate(180deg);}
  .row-text{min-width:0;}
  .row-text .name{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .row-text .meta-inline{font-size:11.5px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .reg-check-right{display:flex;flex-direction:column;align-items:center;gap:2px;flex-shrink:0;cursor:pointer;padding:2px 4px;border-radius:10px;}
  .reg-check-right input{width:19px;height:19px;cursor:pointer;}
  .reg-check-right span{font-size:9px;font-weight:700;color:var(--muted);text-align:center;line-height:1.2;}
  .reg-check-right input:checked ~ span{color:var(--ok);}
  .decline-check-right input:checked ~ span{color:var(--danger);}
  .details{display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);}
  .visitor-item.expanded .details{display:block;}
  .visitor-item .meta{font-size:12px;color:var(--muted);margin-top:2px;}
  .date-edit{cursor:pointer;border-bottom:1px dashed var(--muted);padding-bottom:1px;}
  .date-edit:active{opacity:.6;}
  .visitor-item .note{margin-top:0;margin-bottom:10px;font-size:13px;background:var(--bg);border-radius:8px;padding:8px 10px;}
  .visit-ticks{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
  .tick-box{flex:1;min-width:64px;padding:7px 4px;border-radius:9px;border:1.5px solid var(--border);background:var(--bg);color:var(--muted);font-size:11.5px;font-weight:700;cursor:pointer;text-align:center;}
  .tick-box.checked{background:var(--gold-soft);border-color:var(--gold);color:#8a6d00;}
  .tick-box:disabled{cursor:default;opacity:.9;}
  .tick-box:not(:disabled):hover{border-color:var(--navy);}
  .include-reg-row{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12.5px;color:var(--muted);}
  .include-reg-row input{width:16px;height:16px;}
  .search-bar{margin-bottom:12px;}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 18px;border-radius:999px;font-size:13.5px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;}
  .toast.show{opacity:1;}
  .empty{text-align:center;color:var(--muted);font-size:13px;padding:30px 10px;}
  .toggle{display:flex;align-items:center;gap:8px;cursor:pointer;}
  .spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:60;padding:20px;}
  .modal-backdrop.show{display:flex;}
  .modal{background:var(--card);border-radius:16px;padding:20px;max-width:420px;width:100%;}
  .modal h3{margin:0 0 10px;font-size:15px;}
  .modal p{font-size:12.5px;color:var(--muted);line-height:1.6;}
  .cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-weight:700;font-size:15px;}
  .cal-nav{background:none;border:none;font-size:20px;color:var(--navy);cursor:pointer;padding:4px 10px;}
  .cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px;color:var(--muted);margin-bottom:4px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .cal-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:8px;font-size:13px;cursor:pointer;border:none;background:transparent;color:var(--text);}
  .cal-day.muted{color:var(--border);}
  .cal-day.today{border:1.5px solid var(--gold);}
  .cal-day.selected{background:var(--navy);color:#fff;font-weight:700;}
  .cal-day:disabled{visibility:hidden;cursor:default;}
  .modal .actions{display:flex;gap:8px;margin-top:14px;}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <span class="version-tag">Ver 1.9</span>
    <button class="gear" id="settingsBtn">⚙️</button>
    <div class="title">새가족 방문자 관리</div>
  </header>

  <div class="tabs">
    <button class="tab-btn active" data-tab="scan">📝 새가족 방문자</button>
    <button class="tab-btn" data-tab="list">📋 방문자 관리</button>
    <button class="tab-btn" data-tab="dash">📊 현황</button>
  </div>

  <section class="view active" id="tab-scan">
    <div class="card">
      <h2>새가족 정보</h2>
      <p class="hint" id="formHint">아래에 직접 입력해주세요.</p>
      <label class="field"><span>날짜</span><input type="text" id="f_date" placeholder="날짜 선택" readonly></label>
      <label class="field"><span>이름 *</span><input type="text" id="f_name" placeholder="예: 홍길동"></label>
      <div class="field"><span>구분</span>
        <div class="visit-ticks" id="categoryTicks"></div>
      </div>
      <label class="field"><span>나이 / 연령대</span><input type="text" id="f_age" placeholder="예: 30대"></label>
      <div class="field"><span>오늘 몇 번째 방문</span>
        <div class="visit-ticks" id="nthTicks"></div>
      </div>
      <label class="field"><span>하는 일 (직장 / 학교 / 전공)</span><input type="text" id="f_work" placeholder="예: 회사원 / 유학생"></label>
      <label class="field"><span>하고 싶은 말 / 기도제목</span><textarea id="f_note" placeholder="선택 입력"></textarea></label>
      <label class="include-reg-row" style="margin-top:4px;margin-bottom:14px;"><input type="checkbox" id="f_registered"> 새가족 등록 (오늘 바로 정식 등록되는 경우 체크 — 체크 시 방문자 관리에서 Track 대상에서 제외됩니다)</label>
      <button class="btn btn-primary" id="saveBtn">저장하기</button>
    </div>
  </section>

  <section class="view" id="tab-list">
    <div class="filter-row">
      <button class="filter-btn active" id="filterWeek">이번주 등록</button>
      <button class="filter-btn" id="filterAll">전체</button>
    </div>
    <div class="filter-row">
      <button class="filter-btn active" id="catFilterAll">전체</button>
      <button class="filter-btn" id="catFilterYouth">청년</button>
      <button class="filter-btn" id="catFilterSenior">장년</button>
    </div>
    <div class="card search-bar">
      <input type="text" id="searchInput" placeholder="이름으로 검색">
      <label class="include-reg-row"><input type="checkbox" id="includeRegisteredToggle"> 등록완료/미등록 결정된 새가족도 함께 보기 (기본: 진행중인 새가족만 표시)</label>
      <div class="export-row">
        <button class="btn btn-outline btn-sm" id="exportXlsxBtn" style="width:100%;">⬇️ 명단 내보내기 (Excel)</button>
      </div>
    </div>
    <div id="listContainer"></div>
  </section>

  <section class="view" id="tab-dash">
    <div class="stat-grid">
      <div class="stat"><div class="num" id="statTotal">0</div><div class="label">방문자</div></div>
      <div class="stat"><div class="num" id="statRegistered">0</div><div class="label">새가족 등록 완료</div></div>
      <div class="stat"><div class="num" id="statRate">0%</div><div class="label">등록 전환율</div></div>
    </div>
    <div class="card"><h2>등록 전환율</h2><div class="rate-bar-wrap"><div class="rate-bar" id="rateBar" style="width:0%"></div></div></div>
    <div class="card"><h2>재방문 현황</h2><p class="hint" id="revisitSummary">데이터 불러오는 중...</p></div>
    <div class="card"><h2>최근 등록된 새가족</h2><div id="recentList"></div></div>
  </section>

  <footer class="app-footer">

<div class="toast" id="toast"></div>

<div class="modal-backdrop" id="settingsModal">
  <div class="modal">
    <h3>⚙️ 연결 설정</h3>
    <p>Google Apps Script 배포 후 발급받은 웹앱 URL을 붙여넣으세요. 이 기기에만 저장되며, 실제 데이터는 구글 시트에 저장됩니다.</p>
    <label class="field"><span>Web App URL</span><input type="text" id="webAppUrlInput" placeholder="https://script.google.com/macros/s/xxxx/exec"></label>
    <div class="actions">
      <button class="btn btn-outline btn-sm" id="settingsCancel" style="flex:1;">취소</button>
      <button class="btn btn-primary btn-sm" id="settingsSave" style="flex:1;">저장</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="dateModal">
  <div class="modal">
    <div class="cal-header">
      <button type="button" class="cal-nav" id="calPrev">‹</button>
      <span id="calLabel"></span>
      <button type="button" class="cal-nav" id="calNext">›</button>
    </div>
    <div class="cal-weekdays">
      <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="actions" style="margin-top:12px;">
      <button class="btn btn-outline btn-sm" id="calToday" style="flex:1;">오늘</button>
      <button class="btn btn-outline btn-sm" id="calClose" style="flex:1;">닫기</button>
    </div>
  </div>
</div>

<script>
(function(){
  const $ = s => document.querySelector(s);
  const $$ = s => Array.from(document.querySelectorAll(s));

  const DEFAULT_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbxglyeaqfiU8glPJ4ZLgVvdwqMrvp7OnLbUoGDeO8dx037sRTnpkSPmGsGXZHELJ6Zy/exec';
  function getWebAppUrl(){ return localStorage.getItem('nft_webapp_url') || DEFAULT_WEBAPP_URL; }
  function setWebAppUrl(v){ localStorage.setItem('nft_webapp_url', v); }

  function toast(msg){
    const t = $('#toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(t._timer); t._timer = setTimeout(()=>t.classList.remove('show'), 2200);
  }

  // ---- Settings modal ----
  $('#settingsBtn').addEventListener('click', ()=>{
    $('#webAppUrlInput').value = getWebAppUrl();
    $('#settingsModal').classList.add('show');
  });
  $('#settingsCancel').addEventListener('click', ()=> $('#settingsModal').classList.remove('show'));
  $('#settingsSave').addEventListener('click', ()=>{
    setWebAppUrl($('#webAppUrlInput').value.trim());
    $('#settingsModal').classList.remove('show');
    toast('연결 설정을 저장했습니다.');
    if($('#tab-list').classList.contains('active')) renderList();
    if($('#tab-dash').classList.contains('active')) renderDashboard();
  });

  // ---- API helper ----
  async function apiGet(params){
    const url = getWebAppUrl();
    if(!url) throw new Error('no_url');
    const u = new URL(url);
    Object.entries(params||{}).forEach(([k,v])=>u.searchParams.set(k,v));
    const res = await fetch(u.toString());
    return res.json();
  }
  async function apiPost(body){
    const url = getWebAppUrl();
    if(!url) throw new Error('no_url');
    const res = await fetch(url, {
      method: 'POST',
      headers: {'Content-Type':'text/plain;charset=utf-8'}, // avoids CORS preflight on Apps Script
      body: JSON.stringify(body)
    });
    return res.json();
  }

  // ---- Tabs ----
  $$('.tab-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      $$('.tab-btn').forEach(b=>b.classList.remove('active'));
      $$('.view').forEach(v=>v.classList.remove('active'));
      btn.classList.add('active');
      $('#tab-'+btn.dataset.tab).classList.add('active');
      if(btn.dataset.tab === 'list') renderList();
      if(btn.dataset.tab === 'dash') renderDashboard();
    });
  });

  // ---- Registration "오늘 몇 번째 방문" tick boxes (single select) ----
  let selectedNth = 1;
  function renderNthTicks(){
    const c = $('#nthTicks');
    c.innerHTML = [1,2,3,4].map(n=>{
      const label = n<4 ? (n+'번째') : '4번째+';
      const sel = n===selectedNth;
      return '<button type="button" class="tick-box'+(sel?' checked':'')+'" data-n="'+n+'">'+(sel?'✅ ':'☐ ')+label+'</button>';
    }).join('');
    c.querySelectorAll('.tick-box').forEach(btn=>{
      btn.addEventListener('click', ()=>{ selectedNth = parseInt(btn.dataset.n,10); renderNthTicks(); });
    });
  }
  renderNthTicks();

  // ---- Custom date picker (native <input type=date> is unreliable in some mobile in-app browsers) ----
  // 재사용 가능한 범용 달력: openCalendar(초기Date또는null, onSelect콜백)로 여러 곳(등록 폼의 날짜,
  // 방문자 관리의 첫 방문일/최근 방문일/새가족 등록일 수정)에서 공유해서 사용
  let calViewDate = new Date();
  let calSelectedDate = null; // Date object or null
  let calOnSelect = null; // function(Date) => void
  function pad2(n){ return String(n).padStart(2,'0'); }
  function toISODate(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
  function renderCalendar(){
    const y = calViewDate.getFullYear(), m = calViewDate.getMonth();
    $('#calLabel').textContent = y+'년 '+(m+1)+'월';
    const firstDow = new Date(y, m, 1).getDay();
    const daysInMonth = new Date(y, m+1, 0).getDate();
    const today = new Date();
    let html = '';
    for(let i=0;i<firstDow;i++){ html += '<button class="cal-day" disabled></button>'; }
    for(let d=1; d<=daysInMonth; d++){
      const isToday = today.getFullYear()===y && today.getMonth()===m && today.getDate()===d;
      const isSelected = calSelectedDate && calSelectedDate.getFullYear()===y && calSelectedDate.getMonth()===m && calSelectedDate.getDate()===d;
      html += '<button type="button" class="cal-day'+(isToday?' today':'')+(isSelected?' selected':'')+'" data-d="'+d+'">'+d+'</button>';
    }
    $('#calGrid').innerHTML = html;
    $('#calGrid').querySelectorAll('.cal-day:not(:disabled)').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        calSelectedDate = new Date(y, m, parseInt(btn.dataset.d,10));
        $('#dateModal').classList.remove('show');
        if(calOnSelect) calOnSelect(calSelectedDate);
      });
    });
  }
  function openCalendar(initialDate, onSelect){
    calSelectedDate = initialDate || null;
    calViewDate = calSelectedDate ? new Date(calSelectedDate) : new Date();
    calOnSelect = onSelect;
    renderCalendar();
    $('#dateModal').classList.add('show');
  }
  $('#f_date').addEventListener('click', ()=>{
    openCalendar(calSelectedDate, (d)=>{ $('#f_date').value = toISODate(d); });
  });
  $('#calPrev').addEventListener('click', ()=>{ calViewDate.setMonth(calViewDate.getMonth()-1); renderCalendar(); });

  // ---- List ----
  let cachedVisitors = [];
  let expandedIds = new Set();
  let listFilter = 'week'; // 'week' | 'all'
  function fmtDate(iso){ if(!iso) return '-'; try{ const d=new Date(iso); return d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0'); }catch(e){ return '-'; } }
  function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function startOfWeek(){
    const now = new Date();
    const day = now.getDay(); // 0=Sun..6=Sat
    const diffToMonday = (day === 0) ? 6 : day - 1;
    const monday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - diffToMonday);
    monday.setHours(0,0,0,0);
    return monday;
  }
  function isThisWeek(iso){
    if(!iso) return false;
    const d = new Date(iso);
    return d >= startOfWeek();
  }

    listFilter = 'week';

  function isRegistered(v){ return v.registered===true || v.registered==='TRUE' || v.registered==='true'; }
  function isDeclined(v){ return v.declined===true || v.declined==='TRUE' || v.declined==='true'; }
  function isResolved(v){ return isRegistered(v) || isDeclined(v); }

  async function loadVisitors(){
    if(!getWebAppUrl()) return [];
    try{
      const resp = await apiGet({action:'list'});
      return resp.ok ? resp.visitors : [];
    }catch(e){ toast('명단을 불러오지 못했습니다. 연결 설정을 확인해주세요.'); return []; }

  async function renderList(){
    const container = $('#listContainer');
    container.innerHTML = '<div class="empty">불러오는 중...</div>';
    cachedVisitors = await loadVisitors();
    drawList();

  function drawList(){
    const container = $('#listContainer');
    const q = ($('#searchInput').value||'').trim().toLowerCase();
    const includeRegistered = $('#includeRegisteredToggle').checked;
    let items = cachedVisitors.filter(v => !q || (v.name||'').toLowerCase().includes(q));
    if(listFilter === 'week'){
      items = items.filter(v => isThisWeek(v.createdAt));
    }
    if(catFilter !== 'all'){
      items = items.filter(v => (v.category||'') === catFilter);
    }
    if(!includeRegistered){
      items = items.filter(v => !isResolved(v));
    }
    if(!items.length){
      const msg = includeRegistered
        ? (listFilter==='week' ? '이번주에 등록된 새가족이 없습니다.' : '등록된 새가족이 없습니다.')
        : '진행중인(등록완료/미등록 결정 전) 새가족이 없습니다. 위 체크박스로 등록완료/미등록 결정된 새가족도 볼 수 있습니다.';
      container.innerHTML = '<div class="empty">'+msg+'</div>';
      return;
    }
    container.innerHTML = items.map(visitorCardHtml).join('');
    items.forEach(v => bindVisitorCard(v));
  }
  function bindVisitorCard(v){
    const el = document.getElementById('visit-'+v.id); if(!el) return;
    const summary = el.querySelector('.row-summary');
    if(summary){
      summary.addEventListener('click', (e)=>{
        if(e.target.closest('.reg-check-right')) return;
        el.classList.toggle('expanded');
        if(el.classList.contains('expanded')) expandedIds.add(v.id);
        else expandedIds.delete(v.id);
      });
    }
    el.querySelectorAll('.tick-box:not(.ei-cat-btn)').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const n = parseInt(btn.dataset.n, 10);
        if(n === 4 && (v.visitCount||1) >= 4){
          // 이미 4회 이상이면, 다시 누르면 방문 1회를 추가로 기록 (5회, 6회...)
          addVisit(v.id);
        } else {
          // 1/2/3번째는 언제든 눌러서 방문 횟수를 그 값으로 수정(교정) 가능
          setVisitCount(v.id, n);
        }
      });
    });
    const regToggle = el.querySelector('.reg-toggle');
    if(regToggle) regToggle.addEventListener('change', e=> toggleRegistered(v.id, e.target.checked));
    const declToggle = el.querySelector('.decline-toggle');
    if(declToggle) declToggle.addEventListener('change', e=> toggleDeclined(v.id, e.target.checked));
    el.querySelectorAll('.date-edit').forEach(span=>{
      span.addEventListener('click', (e)=>{
        e.stopPropagation();
        const field = span.dataset.field;
        const current = v[field] ? new Date(v[field]) : null;
        openCalendar((current && !isNaN(current)) ? current : null, (d)=> updateDateField(v.id, field, d));
      });
    });

    // ---- 이름/구분/나이/하는 일/메모 수정 (등록완료 여부와 무관하게 언제든 가능) ----
    const editForm = el.querySelector('.edit-info-form');
    const editToggleBtn = el.querySelector('.edit-info-toggle');
    let editCategory = v.category || '청년';
    function paintCatBtns(){
      el.querySelectorAll('.ei-cat-btn').forEach(b=>{
        const sel = b.dataset.cat === editCategory;
        b.classList.toggle('checked', sel);
        b.textContent = (sel?'✅ ':'☐ ') + b.dataset.cat;
      });

    if(editToggleBtn && editForm){

        editForm.style.display = showing ? 'none' : 'block';
        editToggleBtn.textContent = showing ? '✏️ 정보 수정' : '접기';
      });
    }
    el.querySelectorAll('.ei-cat-btn').forEach(btn=>{
      btn.addEventListener('click', (e)=>{
        e.stopPropagation();
        editCategory = btn.dataset.cat;
        paintCatBtns();
      });

    const cancelBtn = el.querySelector('.ei-cancel');
    if(cancelBtn) cancelBtn.addEventListener('click', (e)=>{
      e.stopPropagation();
      el.querySelector('.ei-name').value = v.name || '';
      el.querySelector('.ei-age').value = v.age || '';
      el.querySelector('.ei-work').value = v.work || '';
      el.querySelector('.ei-note').value = v.note || '';
      editCategory = v.category || '청년';
      paintCatBtns();
      editForm.style.display = 'none';
      if(editToggleBtn) editToggleBtn.textContent = '✏️ 정보 수정';
    });
    const saveInfoBtn = el.querySelector('.ei-save');
    if(saveInfoBtn) saveInfoBtn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const name = el.querySelector('.ei-name').value.trim();
      const age = el.querySelector('.ei-age').value.trim();
      const work = el.querySelector('.ei-work').value.trim();
      const note = el.querySelector('.ei-note').value.trim();
      if(!name){ toast('이름을 입력해주세요.'); return; }
      updateInfo(v.id, { name, age, work, note, category: editCategory });
    });
  }
  function visitorCardHtml(v){
    const registered = isRegistered(v);
    const declined = isDeclined(v);
    const count = v.visitCount || 1;
    let ticks = '<div class="visit-ticks">';

  async function addVisit(id){
    const v = cachedVisitors.find(x=>x.id===id);
    if(!v){ renderList(); return; }
    const prevCount = v.visitCount || 1;
    const prevLastVisitAt = v.lastVisitAt;
    // optimistic update: show the change immediately, without a full reload
    v.visitCount = prevCount + 1;
    v.lastVisitAt = new Date().toISOString();
    drawList();
    try{
      const resp = await apiPost({action:'addVisit', id});
      if(resp.ok){
        toast('방문이 기록되었습니다.');
        if($('#tab-dash').classList.contains('active')) renderDashboard();
      } else {
        toast('업데이트 실패');
        v.visitCount = prevCount; v.lastVisitAt = prevLastVisitAt; drawList();
      }
    }catch(e){
      toast('연결 설정을 확인해주세요.');
      v.visitCount = prevCount; v.lastVisitAt = prevLastVisitAt; drawList();
    }
  }
  async function setVisitCount(id, n){
    const v = cachedVisitors.find(x=>x.id===id);
    if(!v){ renderList(); return; }
    const prevCount = v.visitCount || 1;
    const prevLastVisitAt = v.lastVisitAt;
    // 정확히 선택한 값으로 설정 (교정을 위해 이전 값보다 줄어드는 것도 허용)
    const newCount = n;
    // optimistic update: show the selected tick immediately, without a full reload
    v.visitCount = newCount;
    if(newCount > prevCount) v.lastVisitAt = new Date().toISOString();
    drawList();
    try{
      const resp = await apiPost({action:'setVisitCount', id, value:n});
      if(resp.ok){
        toast(n+'번째 방문으로 기록되었습니다.');
        if($('#tab-dash').classList.contains('active')) renderDashboard();
      } else {
        toast('업데이트 실패');
        v.visitCount = prevCount; v.lastVisitAt = prevLastVisitAt; drawList();
      }
    }catch(e){
      toast('연결 설정을 확인해주세요.');
      v.visitCount = prevCount; v.lastVisitAt = prevLastVisitAt; drawList();
    }
  }
  async function toggleRegistered(id, checked){
    const v = cachedVisitors.find(x=>x.id===id);
    if(!v){ renderList(); return; }
    const prevRegistered = v.registered;
    const prevRegisteredAt = v.registeredAt;
    const prevDeclined = v.declined;
    const prevDeclinedAt = v.declinedAt;
    // optimistic update: reflect the checkbox immediately
    v.registered = checked;
    v.registeredAt = checked ? new Date().toISOString() : '';
    // 등록완료와 미등록 결정은 동시에 될 수 없으므로, 등록완료 체크 시 미등록 표시는 해제
    if(checked){ v.declined = false; v.declinedAt = ''; }
    drawList();
    try{
      const resp = await apiPost({action:'toggleRegistered', id, registered:checked});
      if(resp.ok){
        toast(checked?'등록완료로 표시했습니다. 이제 Track 대상에서 제외됩니다.':'등록 표시를 취소했습니다.');
        if($('#tab-dash').classList.contains('active')) renderDashboard();
      } else {
        toast('업데이트 실패');
        v.registered = prevRegistered; v.registeredAt = prevRegisteredAt;
        v.declined = prevDeclined; v.declinedAt = prevDeclinedAt; drawList();
      }
    }catch(e){
      toast('연결 설정을 확인해주세요.');
      v.registered = prevRegistered; v.registeredAt = prevRegisteredAt;
      v.declined = prevDeclined; v.declinedAt = prevDeclinedAt; drawList();
    }
  }
  async function toggleDeclined(id, checked){
    const v = cachedVisitors.find(x=>x.id===id);
    if(!v){ renderList(); return; }
    const prevDeclined = v.declined;
    const prevDeclinedAt = v.declinedAt;
    const prevRegistered = v.registered;
    const prevRegisteredAt = v.registeredAt;
    // optimistic update: reflect the checkbox immediately
    v.declined = checked;
    v.declinedAt = checked ? new Date().toISOString() : '';
    // 등록완료와 미등록 결정은 동시에 될 수 없으므로, 미등록 체크 시 등록완료 표시는 해제
    if(checked){ v.registered = false; v.registeredAt = ''; }
    drawList();
    try{
      const resp = await apiPost({action:'toggleDeclined', id, declined:checked});
      if(resp.ok){
        toast(checked?'새가족 미등록으로 표시했습니다. 이제 Track 대상에서 제외됩니다.':'미등록 표시를 취소했습니다.');
        if($('#tab-dash').classList.contains('active')) renderDashboard();
      } else {
        toast('업데이트 실패');
        v.declined = prevDeclined; v.declinedAt = prevDeclinedAt;
        v.registered = prevRegistered; v.registeredAt = prevRegisteredAt; drawList();
      }
    }catch(e){
      toast('연결 설정을 확인해주세요.');
      v.declined = prevDeclined; v.declinedAt = prevDeclinedAt;
      v.registered = prevRegistered; v.registeredAt = prevRegisteredAt; drawList();
    }
  }
  async function updateDateField(id, field, dateObj){
    const v = cachedVisitors.find(x=>x.id===id);
    if(!v){ renderList(); return; }
    const prevValue = v[field];
    const newValue = dateObj.toISOString();
    // optimistic update: reflect the corrected date immediately
    v[field] = newValue;
    drawList();
    try{
      const resp = await apiPost({action:'setDateField', id, field, value:newValue});
      if(resp.ok){
        toast('날짜가 수정되었습니다.');
        if($('#tab-dash').classList.contains('active')) renderDashboard();
      } else {
        toast('업데이트 실패');
        v[field] = prevValue; drawList();
      }
    }catch(e){
      toast('연결 설정을 확인해주세요.');
      v[field] = prevValue; drawList();
    }
  }
  async function updateInfo(id, info){
    const v = cachedVisitors.find(x=>x.id===id);
    if(!v){ renderList(); return; }
    const prev = { name:v.name, age:v.age, work:v.work, note:v.note, category:v.category };
    // optimistic update: 등록완료 여부와 무관하게 바로 반영
    v.name = info.name; v.age = info.age; v.work = info.work; v.note = info.note; v.category = info.category;
    drawList();
    try{
      const resp = await apiPost({action:'updateInfo', id, ...info});
      if(resp.ok){
        toast('정보가 수정되었습니다.');
        if($('#tab-dash').classList.contains('active')) renderDashboard();
      } else {
        toast('업데이트 실패');
        Object.assign(v, prev); drawList();
      }
    }catch(e){
      toast('연결 설정을 확인해주세요.');
      Object.assign(v, prev); drawList();
    }
  }
  $('#searchInput').addEventListener('input', drawList);

  // ---- Dashboard ----
  async function renderDashboard(){
    cachedVisitors = await loadVisitors();
    const total = cachedVisitors.length;
    const registered = cachedVisitors.filter(isRegistered).length;
    const rate = total ? Math.round((registered/total)*100) : 0;
    $('#statTotal').textContent = total; $('#statRegistered').textContent = registered; $('#statRate').textContent = rate+'%';
    $('#rateBar').style.width = rate+'%';
    const revisited = cachedVisitors.filter(v => (v.visitCount||1) > 1).length;
    const declinedCount = cachedVisitors.filter(isDeclined).length;
    $('#revisitSummary').textContent = total ? ('첫 방문 '+(total-revisited)+'명, 재방문 '+revisited+'명 (전체 '+total+'명 중) · 새가족 미등록 결정 '+declinedCount+'명') : '아직 등록된 데이터가 없습니다.';
    const recent = [...cachedVisitors].sort((a,b)=> new Date(b.createdAt||0) - new Date(a.createdAt||0)).slice(0,5);
    $('#recentList').innerHTML = recent.length ? recent.map(visitorCardHtml).join('') : '<div class="empty">아직 등록된 새가족이 없습니다.</div>';
    recent.forEach(v => bindVisitorCard(v));
  }

  // ---- Export (always exports full list, regardless of current filter/search) ----
  function toExportRows(list){
    return list.map(v => ({
      '이름': v.name || '',
      '구분': v.category || '',
      '나이/연령대': v.age || '',
      '하는 일': v.work || '',
      '카드 등록일': fmtDate(v.createdAt),
      '카드 기재 날짜': v.cardDate || '',
      '첫 방문 횟수': v.firstVisitNth || 1,
      '누적 방문 횟수': v.visitCount || 1,
      '새가족 등록됨': isRegistered(v) ? 'Y' : 'N',
      '정식 등록일': v.registeredAt ? fmtDate(v.registeredAt) : '',
      '새가족 미등록 결정': isDeclined(v) ? 'Y' : 'N',
      '미등록 결정일': v.declinedAt ? fmtDate(v.declinedAt) : '',
      '첫 방문일': fmtDate(v.firstVisitAt),
      '최근 방문일': fmtDate(v.lastVisitAt),
      '기도제목/메모': v.note || ''
    }));
  }

  async function getExportList(){
    if(!getWebAppUrl()){ toast('먼저 ⚙️ 에서 연결 설정을 해주세요.'); return null; }
    toast('내보낼 데이터를 불러오는 중...');
    const list = await loadVisitors();
    if(!list.length){ toast('내보낼 데이터가 없습니다.'); return null; }
    return list;
  }

  function downloadBlob(blob, filename){
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  $('#exportXlsxBtn').addEventListener('click', async ()=>{
    if(typeof XLSX === 'undefined'){ toast('엑셀 내보내기 기능을 불러오지 못했습니다.'); return; }
    const list = await getExportList();
    if(!list) return;
    const rows = toExportRows(list);
    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, '새가족명단');
    XLSX.writeFile(wb, '새가족_방문자_Track_'+todayStr()+'.xlsx');
    toast('Excel 파일을 내려받았습니다.');
  });

  function todayStr(){
    const d = new Date();
    return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
  }
})();
</script>
</body>
</html>
